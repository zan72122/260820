<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#7d8fa3" />
  <title>ユニコーンと虹糸の橋</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #7d8fa3;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; }
    #veil {
      position: fixed; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, #8fa0b4 0%, #76889c 55%, #5f7186 100%);
      transition: opacity 1.6s ease;
      display: flex; align-items: center; justify-content: center;
    }
    #veil.gone { opacity: 0; }
    #veil .drop {
      width: 14px; height: 18px; border-radius: 50% 50% 55% 55%;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(255,255,255,.25) 60%, rgba(255,255,255,.05));
      animation: fall 1.4s ease-in infinite;
      opacity: .9;
    }
    @keyframes fall {
      0%   { transform: translateY(-26px) scale(1);   opacity: 0; }
      35%  { opacity: .9; }
      80%  { transform: translateY(22px) scale(1);    opacity: .9; }
      100% { transform: translateY(30px) scale(1.4, .5); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="veil"><div class="drop"></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
