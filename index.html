<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>はねかえり素材研究所</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#b9b2a6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="light" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b9b2a6'/%3E%3Ccircle cx='16' cy='12' r='6.4' fill='%23efece4'/%3E%3Ccircle cx='13.8' cy='9.8' r='2.1' fill='%23fff'/%3E%3Cellipse cx='16' cy='25' rx='8' ry='2.2' fill='%236d6558'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light;
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-l: env(safe-area-inset-left, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #a9a396;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        touch-action: none;
      }
      #stage { position: fixed; inset: 0; display: block; touch-action: none; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #b9b2a6; transition: opacity .5s ease; z-index: 10;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .dot {
        width: 74px; height: 74px; border-radius: 50%;
        background: radial-gradient(circle at 34% 30%, #f2f0eb 0%, #cfc9bd 42%, #8e8778 100%);
        box-shadow: 0 16px 26px rgba(40, 34, 26, .28);
        animation: hop 1.05s cubic-bezier(.3, 0, .6, 1) infinite;
      }
      @keyframes hop {
        0%   { transform: translateY(-46px) scale(1, 1); }
        52%  { transform: translateY(0px) scale(1.14, .84); }
        60%  { transform: translateY(-4px) scale(.97, 1.04); }
        100% { transform: translateY(-46px) scale(1, 1); }
      }
      @media (prefers-reduced-motion: reduce) { #boot .dot { animation-duration: 2.4s; } }
      #debug {
        position: fixed;
        top: calc(var(--safe-t) + 6px); left: calc(var(--safe-l) + 6px);
        z-index: 20; display: none;
        font: 11px/1.35 ui-monospace, "SF Mono", Menlo, monospace;
        color: #e8ffe8; background: rgba(12, 18, 12, .72);
        padding: 7px 9px; border-radius: 6px; white-space: pre;
        pointer-events: none; max-height: 82vh; overflow: hidden;
      }
      #debug.on { display: block; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="boot"><div class="dot"></div></div>
    <pre id="debug"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
