<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>すべりだい研究所</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#9ec4d8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a9cfe2'/%3E%3Cpath d='M10 50 L30 50 Q46 50 46 34 L46 12 L54 12 L54 34 Q54 58 30 58 L10 58 Z' fill='%23c9d6dc'/%3E%3Ccircle cx='50' cy='16' r='7' fill='%23e8edef'/%3E%3C/svg%3E"
    />
    <meta name="description" content="いろいろな物を すべりだいで すべらせて、どこまで行くか ためす。" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #8fb6cd;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: block;
      }
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(#a9cfe2, #dce9ee);
        transition: opacity 0.6s ease;
        z-index: 10;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .dot {
        width: 18vmin;
        height: 18vmin;
        max-width: 110px;
        max-height: 110px;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 30%, #fff, #cfd8dc 45%, #8b969c);
        box-shadow: 0 6px 18px rgba(40, 60, 70, 0.28);
        animation: nudge 1.6s ease-in-out infinite;
      }
      @keyframes nudge {
        0%,
        100% {
          transform: translate3d(0, 0, 0);
        }
        50% {
          transform: translate3d(0, 4%, 0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="boot"><div class="dot"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
