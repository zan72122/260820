<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>長岡花火の一晩 — 第2章 復興祈願花火フェニックス</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05070f" />
<meta name="description" content="夜の信濃川河川敷。ひとつの火が、川に沿って左右へ広がっていく。復興祈願花火フェニックスの章。" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050810'/%3E%3Cg stroke='%23ffb85c' stroke-width='1.6' stroke-linecap='round'%3E%3Cpath d='M16 16 L6 11M16 16 L26 11M16 16 L9 21M16 16 L23 21M16 16 L16 7'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23fff2d8'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="stage"></canvas>

  <!-- 川沿いの「つながり」を示すメーター -->
  <div id="riverbar" aria-hidden="true"><div id="riverbar-track"></div><div id="riverbar-dots"></div></div>

  <div id="coach" class="coach hidden"><span class="coach-hand">👆</span><span class="coach-text">ひかってるところを さわってね</span></div>

  <div id="title" class="panel">
    <p class="kicker">ながおか花火の一晩 ・ 第2章</p>
    <h1>フェニックス</h1>
    <p class="lead">しなのがわ の よるです。<br />ひとつの ひ を さわると、<br />かわ に そって よこ に ひろがります。</p>
    <button id="btn-start" class="big">はじめる</button>
    <p class="foot">よこむき（横画面）が いちばん きもちいいです</p>
  </div>

  <div id="finale-caption" class="caption hidden">
    <span class="caption-main">ふえて、ひろがった！</span>
    <span class="caption-sub">かわぞい いちめん の フェニックス</span>
  </div>

  <div id="end" class="panel hidden">
    <p class="kicker">第2章 おわり</p>
    <h1 id="end-title">かわ ぜんぶ に ひろがった</h1>
    <p class="lead" id="end-stat">—</p>
    <button id="btn-again" class="big">もういちど</button>
  </div>

  <button id="btn-sound" class="chip" aria-label="おと">🔊</button>
  <div id="rotate-hint" class="rotate-hint hidden">よこむきにすると もっと ひろい</div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
