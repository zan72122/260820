<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#efe6d2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>かき氷</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 21h20l-10-13z' fill='%23fdfdff'/%3E%3Cpath d='M6 21h20a10 6 0 0 1-20 0z' fill='%23cfe3ef'/%3E%3Cpath d='M16 8l4 5-8 1z' fill='%23f4869f'/%3E%3C/svg%3E" />
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #1b1712;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none; touch-action: none;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---- boot / title veil ---- */
  #veil {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6vh;
    background:
      radial-gradient(120% 90% at 50% 20%, #fbf3de 0%, #e9d8b4 45%, #cdb086 100%);
    transition: opacity .9s ease, visibility .9s;
  }
  #veil.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  #title {
    font-size: clamp(38px, 13vmin, 108px); letter-spacing: .22em; text-indent: .22em;
    color: #2f2a22; font-weight: 500;
    text-shadow: 0 1px 0 rgba(255,255,255,.7), 0 8px 24px rgba(120,90,50,.25);
  }
  #title small { display:block; font-size: .26em; letter-spacing:.5em; text-indent:.5em; opacity:.55; margin-top:.9em; }
  #startbtn {
    width: clamp(84px, 24vmin, 150px); aspect-ratio: 1; border-radius: 50%; border: none;
    background: radial-gradient(circle at 38% 32%, #ffffff, #ffe9ef 40%, #f6a8bd 78%, #d9748f 100%);
    box-shadow: 0 10px 26px rgba(120,60,80,.28), inset 0 -8px 18px rgba(180,90,110,.35), inset 0 6px 12px rgba(255,255,255,.85);
    display: grid; place-items: center; cursor: pointer;
    animation: pulse 2.6s ease-in-out infinite;
  }
  #startbtn::after {
    content: ""; width: 26%; aspect-ratio: 1 / 1.15; background: #fff;
    clip-path: polygon(6% 0%, 100% 50%, 6% 100%);
    filter: drop-shadow(0 2px 3px rgba(150,70,90,.5));
    margin-left: 8%;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  #boot { position: fixed; bottom: 8vh; left: 0; right: 0; text-align:center; color:#6b5a44; font-size: 13px; letter-spacing:.2em; z-index: 21; }
  #boot.gone { display: none; }

  /* ---- in-game overlays ---- */
  #ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #again {
    position: absolute; left: 50%; transform: translateX(-50%) scale(.85);
    bottom: max(5vh, env(safe-area-inset-bottom, 0px));
    padding: 14px 30px; border-radius: 999px; border: none;
    background: linear-gradient(#fffdf6, #f4e6c8);
    box-shadow: 0 8px 20px rgba(90,60,30,.28), inset 0 1px 0 #fff;
    color: #4a3b26; font-size: clamp(17px, 4.6vmin, 26px); letter-spacing: .18em; text-indent: .18em;
    font-family: inherit; opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .5s ease, transform .5s cubic-bezier(.2,1.4,.4,1), visibility .5s;
  }
  #again.show { opacity: 1; visibility: visible; pointer-events: auto; transform: translateX(-50%) scale(1); }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; transition: opacity .5s ease; }
  #err {
    position: fixed; inset: 0; z-index: 40; display:none; padding: 8vw;
    background:#241f18; color:#e8dcc4; font-family: ui-monospace, monospace; font-size: 13px;
    white-space: pre-wrap; overflow: auto; line-height: 1.6;
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="ui">
    <div id="flash"></div>
    <button id="again" type="button">もう いっぱい</button>
  </div>
  <div id="veil">
    <div id="title">かき氷<small>手回し</small></div>
    <button id="startbtn" type="button" aria-label="はじめる"></button>
  </div>
  <div id="boot">したく中…</div>
  <pre id="err"></pre>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
