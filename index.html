<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#8fb06a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="うめの塩と太陽 -- ポトポト、ザラザラ、じわじわ、ずらり" />
    <title>うめの塩と太陽</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='11' fill='%23edc95a'/%3E%3Cpath d='M16 6v5' stroke='%236b8f3a' stroke-width='2' fill='none'/%3E%3C/svg%3E" />
    <style>
      :root {
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-l: env(safe-area-inset-left, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #10160f;
        overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      }
      #app { position: fixed; inset: 0; }
      #gl { display: block; width: 100%; height: 100%; touch-action: none; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      .corner {
        position: absolute;
        top: calc(var(--safe-t) + 10px);
        right: calc(var(--safe-r) + 10px);
        display: flex; gap: 8px; pointer-events: auto;
      }
      .knob {
        width: 46px; height: 46px; border-radius: 50%;
        border: none; padding: 0;
        background: rgba(255, 253, 245, 0.55);
        box-shadow: 0 2px 8px rgba(0,0,0,0.18);
        backdrop-filter: blur(4px);
        display: grid; place-items: center;
        cursor: pointer; transition: transform .15s ease, background .2s ease;
      }
      .knob:active { transform: scale(0.92); }
      .knob svg { width: 26px; height: 26px; display: block; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 42%, #f4efd8 0%, #d9d3b4 60%, #b6b28f 100%);
        transition: opacity .6s ease; z-index: 10;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .seed {
        width: 96px; height: 118px; border-radius: 50% 50% 48% 48% / 46% 46% 54% 54%;
        background: radial-gradient(circle at 36% 32%, #fdf3b8 0%, #f2d873 42%, #d8b33f 78%, #a98524 100%);
        box-shadow: inset -8px -10px 18px rgba(120,90,20,.35), 0 10px 22px rgba(60,50,20,.25);
        animation: bob 2.2s ease-in-out infinite;
      }
      @keyframes bob { 0%,100% { transform: translateY(-6px) rotate(-3deg);} 50% { transform: translateY(6px) rotate(3deg);} }
      #err {
        position: fixed; inset: 0; display: none; place-items: center; padding: 24px;
        background: #221; color: #f6f0dd; font-size: 14px; line-height: 1.6; z-index: 30;
        white-space: pre-wrap; overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="gl"></canvas></div>
    <div id="ui"></div>
    <div id="boot"><div class="seed"></div></div>
    <div id="err"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
