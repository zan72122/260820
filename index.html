<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0e12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="光のトンネル工房 — 半透明FRPパネル・太陽光・水膜でトンネル内に走る光模様をつくる実験工房" />
    <title>光のトンネル工房</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121820'/%3E%3Cellipse cx='16' cy='16' rx='9' ry='6' fill='none' stroke='%23ffd88a' stroke-width='2.4'/%3E%3Cellipse cx='16' cy='16' rx='4' ry='2.4' fill='none' stroke='%2380dcff' stroke-width='2'/%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: dark;
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-l: env(safe-area-inset-left, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #06080b; overflow: hidden; overscroll-behavior: none;
        touch-action: none; -webkit-user-select: none; user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }

      /* ---- boot veil ---- */
      #boot {
        position: fixed; inset: 0; z-index: 40; background: #06080b;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 900ms ease; pointer-events: none;
      }
      #boot.gone { opacity: 0; }
      #boot .slit {
        width: min(46vw, 260px); height: 3px; border-radius: 3px;
        background: linear-gradient(90deg, rgba(255,214,150,0) 0%, rgba(255,222,170,.95) 50%, rgba(255,214,150,0) 100%);
        filter: blur(.4px);
        animation: breathe 2.4s ease-in-out infinite;
        box-shadow: 0 0 26px 6px rgba(255,200,130,.18);
      }
      @keyframes breathe {
        0%, 100% { opacity: .25; transform: scaleX(.72); }
        50% { opacity: 1; transform: scaleX(1); }
      }

      /* ---- one-line caption used only at key beats ---- */
      #caption {
        position: fixed; z-index: 30; left: 50%; transform: translateX(-50%);
        bottom: calc(11% + var(--safe-b)); max-width: min(88vw, 620px);
        text-align: center; color: #fff6e6; letter-spacing: .06em;
        font-size: clamp(17px, 4.4vw, 30px); font-weight: 600; line-height: 1.55;
        text-shadow: 0 2px 18px rgba(0,0,0,.85), 0 0 40px rgba(255,190,120,.25);
        opacity: 0; transition: opacity 700ms ease; pointer-events: none;
        padding: 0 8px;
      }
      #caption.on { opacity: 1; }

      /* ---- quality gear (small, corner, out of play area) ---- */
      #gear {
        position: fixed; z-index: 32; top: calc(8px + var(--safe-t)); right: calc(8px + var(--safe-r));
        width: 44px; height: 44px; border-radius: 50%; border: none;
        background: rgba(18,24,32,.42); backdrop-filter: blur(6px);
        display: grid; place-items: center; opacity: .5; transition: opacity .25s;
        cursor: pointer;
      }
      #gear:active { opacity: 1; }
      #gear svg { width: 22px; height: 22px; fill: #dfe8f2; }
      #panelMenu {
        position: fixed; z-index: 33; top: calc(58px + var(--safe-t)); right: calc(8px + var(--safe-r));
        background: rgba(14,19,26,.9); backdrop-filter: blur(10px); border-radius: 14px;
        padding: 12px 14px; color: #e6eef7; font-size: 13px; display: none;
        box-shadow: 0 12px 40px rgba(0,0,0,.5); min-width: 178px;
      }
      #panelMenu.on { display: block; }
      #panelMenu h4 { margin: 0 0 8px; font-size: 12px; opacity: .6; font-weight: 600; letter-spacing: .08em; }
      #panelMenu .row { display: flex; gap: 6px; margin-bottom: 10px; }
      #panelMenu button {
        flex: 1; padding: 8px 0; border-radius: 9px; border: 1px solid rgba(255,255,255,.14);
        background: rgba(255,255,255,.05); color: #e6eef7; font-size: 12.5px; cursor: pointer;
      }
      #panelMenu button.sel { background: #2f6d9a; border-color: #4e9ccb; }
      #panelMenu .stat { opacity: .55; font-size: 11.5px; line-height: 1.5; }
      #panelMenu .restart { width: 100%; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="caption" aria-live="polite"></div>
    <button id="gear" aria-label="settings">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.2 7.2 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.24-1.12.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.67 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.58-.24 1.12-.56 1.62-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2Z"/></svg>
    </button>
    <div id="panelMenu">
      <h4>QUALITY</h4>
      <div class="row" id="qRow">
        <button data-q="low">低</button><button data-q="medium">中</button><button data-q="high">高</button>
      </div>
      <div class="stat" id="qStat">–</div>
      <button class="restart" id="restartBtn">はじめから</button>
    </div>
    <div id="boot"><div class="slit"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
