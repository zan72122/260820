<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b4d6b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="夏の砂浜でスイカ割り。目隠しをして、まわりの声だけをたよりにスイカをさがす3Dゲーム。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231f7a34'/%3E%3Cpath d='M14 12q6 20 0 40M32 6q5 26 0 52M50 12q-6 20 0 40' stroke='%236fc25a' stroke-width='7' fill='none'/%3E%3C/svg%3E" />
<title>スイカわり</title>
<style>
  :root{
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --ink:#2a1508;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; overscroll-behavior:none;
    background:#0a1a24; color:#fff;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-text-size-adjust:100%;
  }
  #app{ position:fixed; inset:0; }
  canvas#view{ display:block; width:100%; height:100%; touch-action:none; }

  /* ---------- overlays ---------- */
  .layer{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    padding: calc(var(--safe-t) + 12px) calc(var(--safe-r) + 12px) calc(var(--safe-b) + 12px) calc(var(--safe-l) + 12px);
    pointer-events:none;
  }
  .layer.on{ pointer-events:auto; }
  .hidden{ display:none !important; }

  /* Start / title */
  #start{
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(120,205,235,.55), rgba(6,40,60,.86) 70%),
      linear-gradient(180deg,#0e5b7d,#07293a);
    flex-direction:column; gap:min(4.5vh,28px); text-align:center;
    transition:opacity .45s ease; opacity:1;
  }
  #start.fade{ opacity:0; }
  #start h1{
    margin:0; font-size:clamp(34px, 11vw, 88px); letter-spacing:.14em;
    color:#fff4d8; text-shadow:0 6px 0 #1c5e2a, 0 10px 26px rgba(0,0,0,.45);
  }
  #start p{ margin:0; font-size:clamp(14px,3.9vw,20px); line-height:1.9; color:#dff2ff; opacity:.95; }
  .bigbtn{
    pointer-events:auto; border:0; cursor:pointer; font:inherit; font-weight:800;
    color:#3a1207; background:linear-gradient(180deg,#ffe07a,#ffb028);
    font-size:clamp(20px,6vw,30px); letter-spacing:.1em;
    padding: .78em 1.7em; border-radius:999px;
    box-shadow:0 8px 0 #c9741a, 0 16px 34px rgba(0,0,0,.42);
    transition:transform .1s ease, box-shadow .1s ease;
    min-width:min(78vw,340px); min-height:64px;
  }
  .bigbtn:active{ transform:translateY(5px); box-shadow:0 3px 0 #c9741a, 0 8px 18px rgba(0,0,0,.4); }
  .note{ font-size:clamp(11px,3vw,14px); opacity:.72; max-width:34em; line-height:1.8; }

  /* Caption (voices as text — never directional) */
  #caption{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom: calc(var(--safe-b) + 5.2vh);
    max-width: min(86vw, 620px); text-align:center; pointer-events:none;
    font-size:clamp(19px,5.4vw,30px); font-weight:800; letter-spacing:.06em;
    color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.85), 0 0 26px rgba(0,0,0,.6);
    opacity:0; transition:opacity .16s ease;
  }
  #caption.on{ opacity:1; }

  /* Gentle, non-arrow hint text for the grown-up nearby */
  #hint{
    position:fixed; left:50%; transform:translateX(-50%);
    top: calc(var(--safe-t) + 2.4vh);
    text-align:center; pointer-events:none;
    font-size:clamp(13px,3.6vw,18px); font-weight:700; letter-spacing:.08em;
    color:#ffffff; text-shadow:0 2px 8px rgba(0,0,0,.8);
    opacity:0; transition:opacity .5s ease;
    padding:.5em 1.1em; border-radius:999px; background:rgba(0,0,0,.24);
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  }
  #hint.on{ opacity:.96; }

  /* Replay */
  #again{ flex-direction:column; justify-content:flex-end; gap:18px; background:transparent;
    padding-bottom: calc(var(--safe-b) + 3.5vh); }
  #again .panel{
    display:flex; flex-direction:column; align-items:center; gap:16px;
    padding:22px 26px; border-radius:28px;
    background:rgba(8,26,38,.5); backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
    box-shadow:0 18px 50px rgba(0,0,0,.4);
  }
  #again .sub{ font-size:clamp(13px,3.6vw,17px); opacity:.9; letter-spacing:.06em; }

  #loading{
    background:linear-gradient(180deg,#0e5b7d,#07293a); flex-direction:column; gap:18px;
    font-size:16px; letter-spacing:.2em; color:#cfeaff;
  }
  .melon-spin{ width:54px; height:54px; border-radius:50%;
    background:conic-gradient(#1f7a34 0 12%, #6fc25a 0 25%, #1f7a34 0 37%, #6fc25a 0 50%, #1f7a34 0 62%, #6fc25a 0 75%, #1f7a34 0 87%, #6fc25a 0);
    animation:spin 2.4s linear infinite; box-shadow:inset 0 -8px 14px rgba(0,0,0,.35); }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* short landscape: keep the caption clear of the strip of real vision that
     stays visible under the blindfold's hem */
  @media (orientation: landscape) and (max-height: 540px){
    #caption{ bottom: calc(var(--safe-b) + 11vh); font-size:clamp(16px,4.4vh,24px); }
    #start{ gap:min(3vh,16px); }
    #start .note{ font-size:11px; line-height:1.6; }
  }

  @media (prefers-reduced-motion: reduce){ .melon-spin{ animation:none; } }
</style>
</head>
<body>
  <div id="app">
    <canvas id="view"></canvas>

    <div id="hint"></div>
    <div id="caption"></div>

    <div class="layer on" id="loading">
      <div class="melon-spin"></div>
      <div>よみこみちゅう…</div>
    </div>

    <div class="layer on hidden" id="start">
      <h1>スイカわり</h1>
      <p>めかくしをして、<br>まわりの こえだけで スイカを さがそう。</p>
      <button class="bigbtn" id="startBtn">はじめる</button>
      <p class="note">
        音が出ます。イヤホンかステレオスピーカーだと、こえの ひだり・みぎ が よくわかります。<br>
        ※これは画面の中の遊びです。じっさいに 棒を持って歩きまわる遊びは、大人と広い場所で安全に行ってください。
      </p>
    </div>

    <div class="layer hidden" id="again">
      <div class="panel">
        <div class="sub">こんどは こえだけで さがせるかな？</div>
        <button class="bigbtn" id="againBtn">もう いっかい</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
