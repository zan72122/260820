<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#14151a" />
  <title>SHADOW ALPHABET MACHINE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2314151a'/%3E%3Ctext x='8' y='12' font-size='11' text-anchor='middle' fill='%23e8e4da' font-family='sans-serif'%3EA%3C/text%3E%3C/svg%3E" />
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #14151a; overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #14151a; color: #8f939c;
      font: 500 11px/1.6 -apple-system, "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0.42em; text-indent: 0.42em;
      transition: opacity 0.9s ease; z-index: 10;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    #loader .bar {
      width: 120px; height: 2px; background: #26282f; overflow: hidden; border-radius: 1px;
    }
    #loader .bar i {
      display: block; height: 100%; width: 30%; background: #b9bdc6;
      animation: sweep 1.1s ease-in-out infinite alternate;
    }
    @keyframes sweep { from { transform: translateX(-40%); } to { transform: translateX(310%); } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loader" aria-hidden="true">
    <div>SHADOW&nbsp;ALPHABET&nbsp;MACHINE</div>
    <div class="bar"><i></i></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
