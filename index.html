<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b2340" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231b2340'/%3E%3Ccircle cx='20' cy='12' r='6' fill='%23f0e2be'/%3E%3Cpath d='M16 6v10l6 4' stroke='%23c9a463' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>月の振り子時計</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #10141f;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #gl {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      #overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #10141f;
        transition: opacity 900ms ease;
        z-index: 20;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot .disc {
        width: 74px;
        height: 74px;
        border-radius: 50%;
        border: 2px solid rgba(226, 214, 186, 0.28);
        border-top-color: rgba(240, 226, 190, 0.85);
        animation: spin 1.5s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .no-webgl {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 8vw;
        text-align: center;
        font: 500 16px/1.7 system-ui, -apple-system, "Hiragino Sans", sans-serif;
        color: #d8d2c2;
        background: #10141f;
        z-index: 30;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="overlay"></div>
      <div id="boot"><div class="disc"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
