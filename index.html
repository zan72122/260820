<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7d8b7a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="みずをためて、コン――ししおどしの庭" />
    <title>みずをためて、コン――ししおどしの庭</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%236f7a63'/%3E%3Crect x='6' y='13' width='20' height='6' rx='3' fill='%23c8b874'/%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: light dark;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #2a2d26;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP",
          system-ui, -apple-system, sans-serif;
      }
      #app { position: fixed; inset: 0; }
      canvas#view { display: block; width: 100%; height: 100%; touch-action: none; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #23261f;
        color: #cfd3c2;
        font-size: 15px;
        letter-spacing: 0.14em;
        transition: opacity 700ms ease;
        z-index: 40;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="view"></canvas></div>
    <div id="boot"><span>庭を用意しています…</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
