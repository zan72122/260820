<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#7ea6c4" />
  <title>モノレールをのせよう</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #7ea6c4;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #hint {
      position: fixed; left: 50%; bottom: max(9%, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      pointer-events: none; opacity: 0; transition: opacity 0.6s ease;
      will-change: opacity, transform;
    }
    #hint.show { opacity: 0.92; }
    #hint svg { display: block; }
    @keyframes hintSlideUp {
      0% { transform: translateY(26px); opacity: 0; }
      18% { opacity: 1; }
      62% { transform: translateY(-34px); opacity: 1; }
      80% { opacity: 0; }
      100% { transform: translateY(-34px); opacity: 0; }
    }
    @keyframes hintSlideSide {
      0% { transform: translateX(30px); opacity: 0; }
      18% { opacity: 1; }
      62% { transform: translateX(-34px); opacity: 1; }
      80% { opacity: 0; }
      100% { transform: translateX(-34px); opacity: 0; }
    }
    @keyframes hintSlideDown {
      0% { transform: translateY(-26px); opacity: 0; }
      18% { opacity: 1; }
      62% { transform: translateY(34px); opacity: 1; }
      80% { opacity: 0; }
      100% { transform: translateY(34px); opacity: 0; }
    }
    #hint .mover { animation: hintSlideUp 2.4s ease-in-out infinite; }
    #hint.side .mover { animation: hintSlideSide 2.4s ease-in-out infinite; }
    #hint.down .mover { animation: hintSlideDown 2.4s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hint" aria-hidden="true">
    <div class="mover">
      <svg width="84" height="98" viewBox="0 0 84 98" fill="none">
        <g filter="url(#s)">
          <path d="M42 14 C46 14 49 17 49 21 L49 44 L52 42 C55 39 60 40 62 44 L69 57 C71 61 70 66 66 69 L52 82 C49 85 45 86 41 86 L34 86 C27 86 21 81 19 74 L15 58 C14 54 16 50 20 49 C23 48 27 49 29 52 L35 60 L35 21 C35 17 38 14 42 14 Z"
            fill="#ffffff" stroke="#3a4a58" stroke-width="3.5" stroke-linejoin="round"/>
        </g>
        <defs>
          <filter id="s" x="0" y="0" width="84" height="98" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0a2030" flood-opacity="0.4"/>
          </filter>
        </defs>
      </svg>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
