<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#c6d4e2">
<meta name="description" content="ゆきの したに かくれた かわ。ふたを あけて、ゆきを ながそう。">
<title>ゆきの したの かわ</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="gl"></canvas>

<div id="ui">
  <div id="hint" class="hint" aria-live="polite"><span id="hintText"></span></div>

  <div id="tools">
    <button id="btnSound" class="tool" aria-label="おと">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path class="spk" d="M6 12h5l7-5v18l-7-5H6z"/><g class="wav"><path d="M22 11c2.6 2.6 2.6 7.4 0 10"/><path d="M25.5 7.5c4.6 4.6 4.6 12.4 0 17"/></g><path class="mut" d="M22 12l8 8M30 12l-8 8"/></svg>
    </button>
    <button id="btnAgain" class="tool" aria-label="もういちど">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M26 16a10 10 0 1 1-3.2-7.3"/><path d="M26 5v6h-6"/></svg>
    </button>
  </div>
</div>

<div id="boot">
  <div class="bootInner">
    <div class="snowline" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <h1>ゆきの したの かわ</h1>
    <p id="bootMsg">よみこみちゅう…</p>
    <button id="btnStart" class="start" hidden>あそぶ</button>
  </div>
</div>

<div id="oops" hidden>
  <div class="bootInner">
    <h1>あれれ</h1>
    <p id="oopsMsg"></p>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
