<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0d1116" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23a9dcf2'/%3E%3Cstop offset='1' stop-color='%231d5c86'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M16 3c5 7 8 10.5 8 14.5a8 8 0 01-16 0C8 13.5 11 10 16 3z' fill='url(%23g)'/%3E%3C/svg%3E" />
    <title>地下ポンプ室</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070a;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
        touch-action: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas#view {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      canvas#overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        width: 100%;
        height: 100%;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 42%, #16202b 0%, #05070a 72%);
        z-index: 20;
        transition: opacity 0.7s ease;
      }
      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot .drop {
        width: 74px;
        height: 74px;
        border-radius: 50% 50% 50% 4px;
        transform: rotate(45deg);
        background: linear-gradient(150deg, #9fd8ef 0%, #3f8fc0 55%, #1d4f74 100%);
        box-shadow: 0 0 46px rgba(105, 185, 232, 0.42), inset -6px -10px 18px rgba(0, 0, 0, 0.35),
          inset 6px 8px 14px rgba(255, 255, 255, 0.45);
        animation: bob 1.9s ease-in-out infinite;
      }
      @keyframes bob {
        0%,
        100% {
          transform: rotate(45deg) translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: rotate(45deg) translate3d(0, -9px, 0) scale(1.05);
        }
      }
      #boot .bar {
        position: absolute;
        bottom: 26%;
        width: 148px;
        height: 4px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.13);
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 8%;
        border-radius: 3px;
        background: linear-gradient(90deg, #4d9ec9, #b8e6fb);
        transition: width 0.35s ease;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <canvas id="overlay"></canvas>
    </div>
    <div id="boot"><div class="drop"></div><div class="bar"><i id="bootbar"></i></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
