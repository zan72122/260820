<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>こおりの みずうみ ― ワカサギつり</title>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9fc4dc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="こおりに あなを あけて、したの おさかなを つる 3Dゲーム">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🐟</text></svg>">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>

<!-- ===== UI overlay (DOM). 3D itself is all real WebGL. ===== -->
<div id="ui" aria-hidden="true">

  <!-- top bar: catch tally -->
  <div id="tally" class="hidden">
    <span id="tallyFish">🐟</span><span id="tallyX">×</span><span id="tallyNum">0</span>
  </div>

  <!-- big centred coach mark -->
  <div id="coach" class="hidden">
    <div id="coachArt"></div>
    <div id="coachText"></div>
  </div>

  <!-- drilling progress ring -->
  <svg id="ring" class="hidden" viewBox="0 0 120 120">
    <circle class="ringBg" cx="60" cy="60" r="52"></circle>
    <circle id="ringFg" cx="60" cy="60" r="52"></circle>
  </svg>

  <!-- start screen -->
  <div id="start">
    <div id="startTitle">こおりの みずうみ</div>
    <div id="startSub">こおりに あなを あけて、したの おさかなを つろう</div>
    <button id="startBtn" type="button">
      <span class="sIco">🎣</span><span class="sTxt">はじめる</span>
    </button>
    <div id="startHint">ゆびで あそべます · おとが でます</div>
  </div>

  <!-- sound toggle -->
  <button id="sndBtn" class="hidden" type="button" aria-label="おと">🔊</button>
  <!-- restart / new hole -->
  <button id="againBtn" class="hidden" type="button" aria-label="もういちど">↻</button>

  <div id="flash"></div>
</div>

<noscript><p style="color:#fff;font:16px sans-serif;padding:2em">JavaScript を オンに してください。</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
