<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2b1d18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>虹の軌跡織り</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #241a17;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #scene,
      #overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #overlay {
        pointer-events: none;
      }
      #replay {
        position: absolute;
        right: calc(env(safe-area-inset-right, 0px) + 14px);
        top: calc(env(safe-area-inset-top, 0px) + 14px);
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 50%;
        background: rgba(28, 20, 17, 0.32);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: grid;
        place-items: center;
        opacity: 0;
        transition: opacity 0.6s ease;
        pointer-events: none;
        touch-action: manipulation;
      }
      #replay.on {
        opacity: 0.5;
        pointer-events: auto;
      }
      #replay:active {
        opacity: 0.95;
      }
      #replay svg {
        width: 22px;
        height: 22px;
        display: block;
      }
      #boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #241a17;
        transition: opacity 0.9s ease;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot i {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 2px solid rgba(255, 226, 196, 0.18);
        border-top-color: rgba(255, 226, 196, 0.75);
        animation: sp 1.1s linear infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="scene"></canvas>
      <canvas id="overlay"></canvas>
      <button id="replay" aria-label="replay">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffe6cf" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 11a8 8 0 1 0-2.3 5.7" />
          <path d="M20 5v6h-6" />
        </svg>
      </button>
      <div id="boot"><i></i></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
