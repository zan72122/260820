<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#bcd6e2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="ラムネ — ビー玉をポンと落とす、一瞬の物理">
<title>ラムネ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23bcd6e2'/%3E%3Cpath d='M13 4h6v6l3 5v13H10V15l3-5z' fill='%237fc9bb'/%3E%3Ccircle cx='16' cy='8' r='2.6' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #bcd6e2;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #view {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block; touch-action: none;
  }
  #mute {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    right: calc(env(safe-area-inset-right, 0px) + 10px);
    width: 34px; height: 34px; line-height: 34px;
    border: 0; border-radius: 17px; padding: 0;
    background: rgba(255,255,255,0.22); color: #fff;
    font-size: 15px; text-align: center; cursor: pointer;
    opacity: 0.5; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  #mute:active { opacity: 0.85; }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #bcd6e2; color: #4a6b78; font: 500 14px/1.6 system-ui, sans-serif;
    transition: opacity .6s ease; pointer-events: none;
  }
  body.ready #boot { opacity: 0; }
  noscript { position: fixed; inset: 0; display: grid; place-items: center; font: 14px system-ui; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<button id="mute" aria-label="音を消す">🔊</button>
<div id="boot">‥‥</div>
<noscript>JavaScript を有効にしてください。</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
