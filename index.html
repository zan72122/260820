<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#efe7da" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Upside-Down Chiffon — さかさまシフォン" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23efe7da%27/%3E%3Cpath d=%27M12 26h40v22a6 6 0 0 1-6 6H18a6 6 0 0 1-6-6z%27 fill=%27%23c98f42%27/%3E%3Cpath d=%27M12 26c0-8 9-14 20-14s20 6 20 14z%27 fill=%27%23e8c98a%27/%3E%3Ccircle cx=%2732%27 cy=%2740%27 r=%277%27 fill=%27%23efe7da%27/%3E%3C/svg%3E" />
    <title>Upside-Down Chiffon</title>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="hud">
      <svg id="guide" aria-hidden="true">
        <defs>
          <filter id="guide-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="6" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>
        <path id="guide-track" />
        <path id="guide-fill" />
        <circle id="guide-dot" r="13" />
        <polygon id="guide-arrow" points="0,-11 20,0 0,11" />
      </svg>

      <div id="verb" class="verb">
        <svg id="verb-icon" viewBox="0 0 64 64" aria-hidden="true"></svg>
        <span id="verb-label"></span>
      </div>

      <div id="topbar">
        <button id="btn-sound" type="button" aria-label="おと">🔊</button>
        <button id="btn-restart" type="button" aria-label="はじめから">↺</button>
      </div>

      <div id="finish" class="panel hidden">
        <p id="finish-title">できた！</p>
        <div id="flavors"></div>
        <button id="btn-again" type="button">もういちど</button>
      </div>

      <div id="loading">
        <div class="spinner"></div>
        <p>したく中…</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
