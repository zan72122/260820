<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>投網の花</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d2230">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="一本のスワイプで投網が花のようにひらく、4歳からの静かな海辺のあそび。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d2230'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23d8c9a6' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='4' fill='none' stroke='%23d8c9a6' stroke-width='1'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0d2230;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  /* Diegetic-only overlay. No tutorial sentences: shapes and light do the teaching. */
  #overlay { position: fixed; inset: 0; pointer-events: none; }
  #overlay svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 90% at 50% 30%, #1d3d4e 0%, #0b1c27 70%);
    transition: opacity 900ms ease; z-index: 10;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .mark {
    width: 92px; height: 92px; border-radius: 50%;
    border: 1.5px solid rgba(226, 211, 176, 0.75);
    box-shadow: inset 0 0 0 10px rgba(226, 211, 176, 0.06);
    animation: breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(0.86); opacity: 0.55; }
    50%      { transform: scale(1.0);  opacity: 0.95; }
  }
  #err {
    position: fixed; inset: auto 0 0 0; padding: 12px 14px; z-index: 20;
    background: #2a1013; color: #ffd9d2; font-size: 12px; line-height: 1.5;
    white-space: pre-wrap; display: none;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="overlay"></div>
  <div id="boot"><div class="mark"></div></div>
  <pre id="err"></pre>
  <script type="module">
    const err = document.getElementById('err');
    const show = (m) => { err.style.display = 'block'; err.textContent += m + '\n'; };
    window.addEventListener('error', (e) => show('⚠ ' + (e.message || e.error)));
    window.addEventListener('unhandledrejection', (e) => show('⚠ ' + (e.reason && e.reason.message || e.reason)));
    import('./src/main.js').catch((e) => show('⚠ ' + (e && e.message || e)));
  </script>
</body>
</html>
