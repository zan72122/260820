<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>流しそうめん</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#8fb26a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23cfe0b0'/%3E%3Cpath d='M2 21c6-3 22-3 28 0v3c-6 3-22 3-28 0z' fill='%238fae5c'/%3E%3Cpath d='M4 21.6c6-2.2 18-2.2 24 0v1.2c-6 2.2-18 2.2-24 0z' fill='%23bfe4ea'/%3E%3Cg stroke='%23fff' stroke-width='1.1' stroke-linecap='round'%3E%3Cpath d='M11 22.2h7'/%3E%3Cpath d='M12 23.2h6'/%3E%3C/g%3E%3C/svg%3E"
    />
    <style>
      :root { color-scheme: light; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d1410;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app { position: fixed; inset: 0; }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      /* Non-verbal load veil: a warm summer light that simply dissolves. */
      #veil {
        position: fixed;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 30%, #fdf6e0 0%, #e8dcb8 45%, #cdbf95 100%);
        transition: opacity 900ms ease-out;
        pointer-events: none;
        z-index: 10;
      }
      #veil.gone { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="veil"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
