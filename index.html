<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05080f">
<meta name="description" content="長岡花火 最終章 — 橋のナイアガラと正三尺玉。信濃川の夜を、下向きの光の滝と上向きの大玉で同時に満たす。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>長岡花火 最終章 — 橋のナイアガラと正三尺玉</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070c17'/%3E%3Cg stroke='%23ffc45a' stroke-width='1.6' stroke-linecap='round'%3E%3Cpath d='M3 19h26'/%3E%3Cpath d='M4 19 L9 13 L14 19 L19 13 L24 19 L28 15'/%3E%3C/g%3E%3Cg stroke='%23ffb347' stroke-width='1.3' stroke-linecap='round' opacity='.9'%3E%3Cpath d='M7 20v6'/%3E%3Cpath d='M12 20v7'/%3E%3Cpath d='M17 20v5'/%3E%3Cpath d='M22 20v7'/%3E%3C/g%3E%3Cg stroke='%23fff1cf' stroke-width='1.2' stroke-linecap='round'%3E%3Cpath d='M16 8V3'/%3E%3Cpath d='M12.5 9 L9.5 5'/%3E%3Cpath d='M19.5 9 L22.5 5'/%3E%3Cpath d='M10 11 L5.5 9'/%3E%3Cpath d='M22 11 L26.5 9'/%3E%3C/g%3E%3Ccircle cx='16' cy='9' r='1.6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="stage">
  <canvas id="scene"></canvas>

  <!-- 演出テキスト（場内アナウンス風） -->
  <div id="announce" class="announce" aria-live="polite"></div>

  <!-- 章タイトル -->
  <section id="title" class="overlay title-card">
    <div class="title-inner">
      <p class="kicker">長岡まつり大花火大会</p>
      <h1>最終章<span class="sub">橋のナイアガラと正三尺玉</span></h1>
      <p class="lede">信濃川。<br>下は 光の たき。<br>上は おおきな はなび。</p>
      <button id="btnStart" class="big-btn primary" type="button">
        <span class="ico">▶</span><span class="lbl">はじめる</span>
      </button>
      <p class="hint">音がでます・よこむきでも たてむきでも あそべます</p>
    </div>
  </section>

  <!-- 操作1：橋ナイアガラ -->
  <button id="btnNiagara" class="big-btn action step1" type="button" hidden>
    <svg class="ico-svg" viewBox="0 0 48 30" aria-hidden="true" focusable="false">
      <path d="M2 13 L10 4 L18 13 L26 4 L34 13 L42 4 L46 9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1 14 H47" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".85">
        <path d="M6 17 V27"/><path d="M13 17 V29"/><path d="M20 17 V25"/><path d="M27 17 V29"/><path d="M34 17 V26"/><path d="M41 17 V28"/>
      </g>
    </svg>
    <span class="lbl">はしに ひを つける</span>
    <span class="sublbl">↓ ひかりの たき</span>
  </button>

  <!-- 操作2：正三尺玉 -->
  <button id="btnShell" class="big-btn action step2" type="button" hidden>
    <svg class="ico-svg" viewBox="0 0 32 30" aria-hidden="true" focusable="false">
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".9">
        <path d="M16 2 V6"/><path d="M8.5 4.5 L10.5 8"/><path d="M23.5 4.5 L21.5 8"/><path d="M3 11 L7 12.5"/><path d="M29 11 L25 12.5"/>
      </g>
      <path d="M16 9 L25 20 H19 V29 H13 V20 H7 Z" fill="currentColor"/>
    </svg>
    <span class="lbl">たまを うちあげる</span>
    <span class="sublbl">↑ しょうさんじゃくだま</span>
  </button>

  <!-- 結果・余韻 -->
  <section id="result" class="overlay result-card" hidden>
    <div class="result-inner">
      <p id="resultStars" class="stars">★★★</p>
      <h2 id="resultTitle">だいせいこう！</h2>
      <p id="resultBody" class="result-body"></p>
      <button id="btnReplay" class="big-btn primary" type="button">
        <span class="ico">↻</span><span class="lbl">もういちど</span>
      </button>
    </div>
  </section>

  <button id="btnSound" class="chip" type="button" aria-pressed="true" title="音">
    <span id="soundIco">🔊</span>
  </button>

  <div id="loading" class="loading">よみこみ中…</div>
</div>
<script type="module" src="./src/main.js"></script>
<noscript><p style="color:#fff;padding:2rem">JavaScript を有効にしてください。</p></noscript>
</body>
</html>
