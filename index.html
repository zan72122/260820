<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7a4a30" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%237a4a30'/%3E%3Cpath d='M16 4v10' stroke='%235c4426' stroke-width='3'/%3E%3Cpath d='M16 14 L7 26 M16 14 L16 28 M16 14 L25 25' stroke='%23c2a071' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Cassava</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #6b4432;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #app > canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        touch-action: none;
      }
      /* Non-verbal loading veil: a plain earth-coloured field that fades out. */
      #veil {
        position: fixed;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 40%, #9a6a4b 0%, #6b4432 70%, #4d3122 100%);
        transition: opacity 700ms ease;
        pointer-events: none;
        z-index: 10;
      }
      #veil.gone {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="veil"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
