<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#b9a888" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%A5%9C%3C/text%3E%3C/svg%3E" />
    <title>畝の裏側</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #6d6250;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #6d6250; transition: opacity .6s ease; z-index: 10;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .seed {
        width: 46px; height: 30px; border-radius: 50% / 60%;
        background: radial-gradient(circle at 35% 30%, #e6cfa4, #b58d55 60%, #7d5c31);
        animation: bob 1.4s ease-in-out infinite;
      }
      @keyframes bob { 0%,100% { transform: translateY(0) rotate(-8deg);} 50% { transform: translateY(-10px) rotate(8deg);} }
      @media (prefers-reduced-motion: reduce) { #boot .seed { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot"><div class="seed"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
