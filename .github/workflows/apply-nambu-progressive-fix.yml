name: Apply progressive first-scene overhaul

on:
  push:
    branches:
      - chatgpt/nambu-ironware-foundry-3d
    paths:
      - 'nambu-progressive-fix/**'
      - '.github/workflows/apply-nambu-progressive-fix.yml'

permissions:
  contents: write

concurrency:
  group: nambu-progressive-first-scene-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[progressive-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify and apply the progressive-forming source patch
        shell: bash
        run: |
          set -euo pipefail
          echo '6f03aead1bfdb3eea9b23b3945658e5d51140cf1f89ae6bd6a39ddd8ca279f60  nambu-progressive-fix/patch.tar.xz' | sha256sum --check --strict
          tar -xJf nambu-progressive-fix/patch.tar.xz -C .
          rm -rf nambu-progressive-fix
          rm -f .github/workflows/apply-nambu-progressive-fix.yml

      - name: Run structural, state, and gesture tests
        working-directory: nambu-ironware-foundry-3d
        run: npm test

      - name: Commit the rebuilt first chapter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild progressive mold forming and circle interaction [progressive-applied]'
          git push origin HEAD:${GITHUB_REF_NAME}
