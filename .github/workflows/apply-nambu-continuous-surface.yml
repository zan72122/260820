name: Apply continuous sand-surface rebuild

on:
  push:
    branches:
      - chatgpt/nambu-ironware-foundry-3d
    paths:
      - 'nambu-continuous-surface/**'
      - '.github/workflows/apply-nambu-continuous-surface.yml'

permissions:
  contents: write

concurrency:
  group: nambu-continuous-surface-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[continuous-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify and apply the continuous-surface patch
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n' < nambu-continuous-surface/patch.tar.xz.b64 | base64 --decode > /tmp/nambu-continuous-surface.tar.xz
          echo 'cc9048fc5373c63370a988255cf2d95611a01a10987cd4af5ca99c1b950a6501  /tmp/nambu-continuous-surface.tar.xz' | sha256sum --check --strict
          tar -xJf /tmp/nambu-continuous-surface.tar.xz -C nambu-ironware-foundry-3d
          rm -rf nambu-continuous-surface
          rm -f .github/workflows/apply-nambu-continuous-surface.yml

      - name: Run structural, persistence, and gesture tests
        working-directory: nambu-ironware-foundry-3d
        run: npm test

      - name: Commit the continuous material and shape evolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace stacked mold rings with continuous material evolution [continuous-applied]'
          git push origin HEAD:${GITHUB_REF_NAME}
