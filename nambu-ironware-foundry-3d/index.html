<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#080705">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="鉄瓶、うまれる。">
  <meta name="description" content="南部鉄瓶が砂・火・鉄から生まれる工程を、写実的な3D工房で体験する4歳児向けモバイルゲーム。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>鉄瓶、うまれる。</title>
</head>
<body>
  <main id="app" aria-label="南部鉄器 3Dゲーム">
    <div id="fallbackArt" aria-hidden="true">
      <div class="fallback-kettle"></div>
      <div class="fallback-fire"></div>
    </div>

    <section id="loading" class="screen active" aria-live="polite">
      <div class="loading-mark" aria-hidden="true"><span></span></div>
      <p id="loadingText">工房に火を入れています</p>
    </section>

    <section id="titleScreen" class="screen" aria-label="タイトル">
      <div class="title-lockup">
        <p class="eyebrow">IWATE · NANBU TEKKI</p>
        <h1>鉄瓶、<br>うまれる。</h1>
        <p class="title-sub">砂　火　鉄</p>
      </div>
      <div class="title-actions">
        <button id="startButton" class="start-button" type="button" aria-label="はじめる">
          <span class="start-glyph" aria-hidden="true">▶</span>
          <span id="startLabel">はじめる</span>
        </button>
        <button id="newGameButton" class="text-button hidden" type="button">はじめから</button>
      </div>
      <p class="title-note">画面を横向きにすると、工房が広く見えます</p>
    </section>

    <header id="hud" class="hud hidden">
      <div class="hud-left">
        <button id="homeButton" class="icon-button" type="button" aria-label="タイトルへ戻る">⌂</button>
        <div class="scene-copy">
          <span id="chapterName" class="chapter-name"></span>
          <strong id="sceneName"></strong>
          <small id="stepName"></small>
        </div>
      </div>
      <div class="hud-right">
        <button id="processButton" class="icon-button" type="button" aria-label="工程を見る">▦</button>
        <button id="settingsButton" class="icon-button" type="button" aria-label="調整">☰</button>
      </div>
    </header>

    <div id="progressRail" class="progress-rail hidden" aria-hidden="true">
      <div id="progressFill"></div>
      <div id="chapterTicks"></div>
    </div>

    <section id="instruction" class="instruction hidden" aria-live="polite">
      <div id="gestureIcon" class="gesture-icon" aria-hidden="true"></div>
      <div class="instruction-copy">
        <strong id="instructionMain"></strong>
        <small id="instructionSub"></small>
      </div>
      <div id="holdMeter" class="hold-meter" aria-hidden="true"><span></span></div>
    </section>

    <section id="autoStep" class="auto-step hidden" aria-live="polite">
      <span id="autoStepNumber"></span>
      <strong id="autoStepTitle"></strong>
      <small id="autoStepDetail"></small>
      <button id="skipAutoButton" type="button" aria-label="自動工程を送る">›</button>
    </section>

    <section id="chapterCard" class="chapter-card hidden" aria-live="polite">
      <span id="chapterNumber"></span>
      <h2 id="chapterTitle"></h2>
      <p id="chapterPhrase"></p>
    </section>

    <section id="reward" class="reward hidden" aria-live="polite">
      <div class="reward-seal" aria-hidden="true">鉄</div>
      <strong id="rewardText">できた</strong>
      <small id="rewardDetail"></small>
    </section>

    <section id="completion" class="completion screen" aria-label="完成">
      <div class="completion-copy">
        <span class="completion-kicker">48の工程</span>
        <h2>鉄瓶が、<br>道具になった。</h2>
        <p id="completionStats"></p>
      </div>
      <div class="completion-actions">
        <button id="replayButton" class="replay-button" type="button" aria-label="もう一つ作る">
          <span aria-hidden="true">↻</span>
          <b>もう一つ</b>
        </button>
        <button id="freeViewButton" class="text-button" type="button">工房を見る</button>
      </div>
    </section>

    <aside id="settingsPanel" class="panel panel-left" aria-label="調整">
      <button class="panel-close" data-close-panel type="button" aria-label="閉じる">×</button>
      <div class="panel-heading">
        <span>微調整</span>
        <h2>工房の見え方と手応え</h2>
      </div>
      <div class="preset-row">
        <button type="button" data-preset="real">写実優先</button>
        <button type="button" data-preset="child">4歳優先</button>
        <button type="button" data-preset="cinema">暗い工房</button>
      </div>
      <div id="settingControls"></div>
      <div class="panel-actions">
        <button id="resetSettings" type="button">初期値へ戻す</button>
        <button id="copySettings" type="button">調整値をコピー</button>
      </div>
    </aside>

    <aside id="processPanel" class="panel panel-right" aria-label="製造工程">
      <button class="panel-close" data-close-panel type="button" aria-label="閉じる">×</button>
      <div class="panel-heading">
        <span>南部鉄瓶</span>
        <h2>48の工程</h2>
      </div>
      <p class="process-legend"><i class="interactive-dot"></i>自分で動かす　<i class="auto-dot"></i>職人が進める</p>
      <div id="processList" class="process-list"></div>
    </aside>

    <div id="pauseShade" class="pause-shade hidden">
      <button id="resumeButton" type="button">つづける</button>
    </div>

    <div id="fatal" class="fatal hidden" role="alert">
      <strong>3D工房を開けませんでした</strong>
      <p>通信を確認して、もう一度読み込んでください。</p>
      <button type="button" onclick="location.reload()">もう一度</button>
    </div>

    <div id="vignette" aria-hidden="true"></div>
    <div id="heatOverlay" aria-hidden="true"></div>
    <div id="flash" aria-hidden="true"></div>
    <div id="toast" aria-live="polite"></div>
  </main>

  <script src="js/bootstrap.js"></script>
</body>
</html>
